log_format compass '$remote_addr "$request_method $uri" $status $body_bytes_sent';
server {
    access_log /dev/stdout compass;
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }
    location ~ ^/(api|oauth2|login)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # This image is behind the HTTPS ALB; never trust client-provided forwarded host/proto.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 170s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
