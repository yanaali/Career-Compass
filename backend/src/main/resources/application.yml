server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    placeholders:
      legacyOwner: ${LEGACY_OWNER:local:compass}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/career_compass}
    username: ${DATABASE_USER:career_compass}
    password: ${DATABASE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  username: ${APP_USERNAME:compass}
  password: ${APP_PASSWORD:}
  auth-mode: ${AUTH_MODE:basic}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ca-central-1}
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
