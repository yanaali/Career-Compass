name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Require Docker here so PostgreSQL integration tests cannot silently skip in CI.
      - run: docker info
      - run: mvn -B -f backend/pom.xml verify
      - name: Require database tests to run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          result = ET.parse('backend/target/surefire-reports/TEST-com.careercompass.ApplicationDatabaseTest.xml').getroot()
          assert int(result.attrib['tests']) > 0 and int(result.attrib['skipped']) == 0, 'Database tests were skipped'
          PY
  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: compass_test
      PGUSER: compass
      PGPASSWORD: test-password
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r ai-service/requirements.txt
      - run: python -m pytest tests -q
        working-directory: ai-service
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PASSWORD: local-ci-password
      APP_USERNAME: compass
      APP_PASSWORD: local-ci-password
      AI_SERVICE_TOKEN: local-ci-service-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
      - run: docker build -f Dockerfile.web -t compass-web-check .
      - run: docker build -t compass-ai-check ai-service
      - run: docker build -t compass-api-check backend
      - run: docker compose up --build -d
      - run: python scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
